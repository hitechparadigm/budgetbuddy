AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BudgetBuddy Local Testing Template

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        TABLE_NAME: budgetbuddy-main
        USER_POOL_ID: us-east-1_LAkOBLENO
        NODE_ENV: development

Resources:
  # Transaction Function
  TransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/transactions/
      Handler: index.handler
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          TABLE_NAME: budgetbuddy-main
      Events:
        TransactionHealthApi:
          Type: Api
          Properties:
            Path: /transactions/health
            Method: get
        TransactionListApi:
          Type: Api
          Properties:
            Path: /transactions
            Method: get
        TransactionCreateApi:
          Type: Api
          Properties:
            Path: /transactions
            Method: post
        TransactionGetApi:
          Type: Api
          Properties:
            Path: /transactions/{transactionId}
            Method: get
        TransactionUpdateApi:
          Type: Api
          Properties:
            Path: /transactions/{transactionId}
            Method: put
        TransactionDeleteApi:
          Type: Api
          Properties:
            Path: /transactions/{transactionId}
            Method: delete

  # Common Layer (simplified for local testing)
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: budget-buddy-common-local
      Description: Common utilities for local testing
      ContentUri: backend/layers/common/
      CompatibleRuntimes:
        - nodejs18.x

Outputs:
  TransactionApi:
    Description: "API Gateway endpoint URL for Transaction function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/transactions/"
