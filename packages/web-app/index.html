<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy - AI-Powered Family Budgeting</title>
    <!-- Apply theme before React loads to prevent flash of light theme -->
    <script>
        (function() {
            try {
                var mode = localStorage.getItem('budgetbuddy-theme-mode');
                var isDark = mode === 'dark' ||
                    (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
                    (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {
                // localStorage blocked (e.g. private browsing) — fall back to system preference
                try {
                    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.classList.add('dark');
                    }
                } catch(e2) { /* ignore */ }
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
