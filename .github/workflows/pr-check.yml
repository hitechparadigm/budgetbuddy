name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check for syntax errors in Lambda functions
        run: |
          echo "🔍 Checking for optional chaining syntax errors..."
          if grep -r "? \." backend/functions/*/index.js; then
            echo "❌ Found invalid optional chaining syntax (? .) in Lambda functions!"
            echo "   Please use ?. instead of ? ."
            exit 1
          fi
          echo "✅ No optional chaining syntax errors found"

      - name: Validate Lambda function syntax
        run: |
          echo "🔍 Validating JavaScript syntax in Lambda functions..."
          for file in backend/functions/*/index.js; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              node -c "$file" || exit 1
            fi
          done
          echo "✅ All Lambda functions have valid syntax"

      - name: Check formatting (placeholder)
        run: echo "Formatting check placeholder - prettier not configured"

      - name: TypeScript compilation check
        run: npm run type-check

  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm install

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: CDK synthesis validation
        working-directory: infrastructure
        run: npx cdk synth --all --context environment=dev

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  lambda-function-tests:
    name: Lambda Function Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install Lambda function dependencies
        run: |
          cd backend/functions/auth && npm install
          cd ../budget && npm install
          cd ../transactions && npm install
          cd ../ai && npm install
          cd ../family && npm install
          cd ../payment && npm install
          cd ../email && npm install
          cd ../admin && npm install

      - name: Run Lambda function tests
        run: npm run test:lambda

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, infrastructure-validation, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Validate build artifacts
        run: |
          echo "Validating build outputs..."
          echo "Build validation completed successfully"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, infrastructure-validation, unit-tests, security-scan, lambda-function-tests, build-validation]
    if: always()

    steps:
      - name: PR Validation Summary
        run: |
          echo "## Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Tests | ${{ needs.lambda-function-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.code-quality.result }}" == "success" &&
                "${{ needs.infrastructure-validation.result }}" == "success" &&
                "${{ needs.unit-tests.result }}" == "success" &&
                "${{ needs.build-validation.result }}" == "success" ]]; then
            echo "🎉 **All validation checks passed!** This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some validation checks failed.** Please review and fix the issues before merging." >> $GITHUB_STEP_SUMMARY
          fi
