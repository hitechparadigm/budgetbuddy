name: Deploy to Development

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual deployment trigger"

# Prevent parallel deployments — queue them instead of cancelling
# This avoids CloudFormation conflicts when multiple commits are pushed quickly
concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Security pre-deployment scan
        run: |
          echo "🔒 Running comprehensive security checks before deployment..."

          # Make security script executable
          chmod +x scripts/security-check.sh

          # Run security checks using bash script
          bash scripts/security-check.sh

      - name: Validate production configuration
        run: |
          echo "🔍 Validating production configuration security..."

          # Check that mock auth is not used in production builds
          if grep -r "initMockAuth\|isMockAuthActive" packages/web-app/src --exclude="mockAuth.ts" --exclude="*.test.*"; then
            echo "⚠️  WARNING: Found mock auth usage in production code"
            echo "   Please ensure mock auth is disabled in production"
          fi

          # Verify HTTPS is enforced
          if grep -r "http://" infrastructure/ --include="*.ts" | grep -v "localhost\|127.0.0.1"; then
            echo "❌ Found HTTP URLs in infrastructure - use HTTPS only"
            exit 1
          fi

          echo "✅ Production configuration security validated"

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build infrastructure
        working-directory: infrastructure
        run: |
          npm install
          npm run build

      - name: CDK synthesis validation
        working-directory: infrastructure
        run: npx cdk synth --all --context environment=${{ env.ENVIRONMENT }}

  deploy-infrastructure:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: development

    outputs:
      api-url: ${{ steps.get-outputs.outputs.api-url }}
      user-pool-id: ${{ steps.get-outputs.outputs.user-pool-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.HITECHPARADIGM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.HITECHPARADIGM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm install

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm install

      - name: Install Lambda layer dependencies
        run: |
          cd backend/layers/common/nodejs
          npm install --production

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Bootstrap CDK (if needed)
        working-directory: infrastructure
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Bootstrapping CDK..."
            npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}
          else
            echo "CDK already bootstrapped"
          fi

      - name: Deploy infrastructure stacks
        working-directory: infrastructure
        run: |
          echo "Deploying BudgetBuddy infrastructure to development environment..."

          # Deploy stacks in specific order to handle CloudFormation export dependencies
          # When CommonLayer version changes in api stack, dependent stacks must be deployed first
          # This allows them to continue using the old layer while api stack updates

          echo "Step 1: Deploying base stacks (database, auth, hosting)..."
          npx cdk deploy budgetbuddy-${{ env.ENVIRONMENT }}-database \
            budgetbuddy-${{ env.ENVIRONMENT }}-auth \
            budgetbuddy-${{ env.ENVIRONMENT }}-hosting \
            budgetbuddy-${{ env.ENVIRONMENT }}-auth-onboarding \
            --require-approval never \
            --context environment=${{ env.ENVIRONMENT }} || echo "Base stacks deployment may have failed, continuing..."

          echo "Step 2: Deploying dependent stacks (api-features, api-features-extended, api-budgets, api-family, notification)..."
          npx cdk deploy budgetbuddy-${{ env.ENVIRONMENT }}-api-features \
            budgetbuddy-${{ env.ENVIRONMENT }}-api-features-extended \
            budgetbuddy-${{ env.ENVIRONMENT }}-api-budgets \
            budgetbuddy-${{ env.ENVIRONMENT }}-api-family \
            budgetbuddy-${{ env.ENVIRONMENT }}-notification \
            --require-approval never \
            --context environment=${{ env.ENVIRONMENT }} || echo "Dependent stacks deployment may have failed, continuing..."

          echo "Step 3: Deploying main API stack (may update CommonLayer export)..."
          npx cdk deploy budgetbuddy-${{ env.ENVIRONMENT }}-api \
            --require-approval never \
            --context environment=${{ env.ENVIRONMENT }} || echo "API stack deployment may have failed, continuing..."

          # Deploy all remaining stacks and generate outputs
          echo "Step 4: Deploying all remaining stacks..."
          npx cdk deploy --all \
            --require-approval never \
            --context environment=${{ env.ENVIRONMENT }} \
            --outputs-file cdk-outputs.json

      - name: Get deployment outputs
        id: get-outputs
        working-directory: infrastructure
        run: |
          if [ -f cdk-outputs.json ]; then
            API_URL=$(jq -r '.["budgetbuddy-dev-api"].ApiUrl // empty' cdk-outputs.json)
            USER_POOL_ID=$(jq -r '.["budgetbuddy-dev-auth"].UserPoolId // empty' cdk-outputs.json)

            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT

            echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
            echo "- **API URL**: $API_URL" >> $GITHUB_STEP_SUMMARY
            echo "- **User Pool ID**: $USER_POOL_ID" >> $GITHUB_STEP_SUMMARY
          else
            echo "No CDK outputs file found"
          fi

  deploy-web-app:
    name: Deploy Web Application
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.HITECHPARADIGM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.HITECHPARADIGM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        working-directory: packages/shared
        run: |
          npm install
          npm run build

      - name: Build web application
        working-directory: packages/web-app
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_BUDGETS_API_URL: "https://jcl39tq8x0.execute-api.us-east-1.amazonaws.com/v1"
        run: |
          npm install
          npm run build

      - name: Deploy to S3
        working-directory: packages/web-app
        run: |
          echo "Deploying web app to S3..."
          aws s3 sync dist/ s3://budgetbuddy-${{ env.ENVIRONMENT }}-web-app --delete

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name budgetbuddy-${{ env.ENVIRONMENT }}-hosting \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text 2>/dev/null || echo "E1L1SU9OV8L4YR")

          aws cloudfront create-invalidation \
            --distribution-id "${CF_ID:-E1L1SU9OV8L4YR}" \
            --paths "/*"

      - name: Web app deployment summary
        run: |
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name budgetbuddy-${{ env.ENVIRONMENT }}-hosting \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text 2>/dev/null || echo "https://d1ueeugn9zcx7n.cloudfront.net")

          echo "## 🌐 Web App Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${CF_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: budgetbuddy-${{ env.ENVIRONMENT }}-web-app" >> $GITHUB_STEP_SUMMARY

  health-checks:
    name: Post-deployment Health Checks
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-web-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.HITECHPARADIGM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.HITECHPARADIGM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check CloudFormation stacks
        run: |
          echo "Checking CloudFormation stacks..."
          stacks=(
            "budgetbuddy-${{ env.ENVIRONMENT }}-database"
            "budgetbuddy-${{ env.ENVIRONMENT }}-auth"
            "budgetbuddy-${{ env.ENVIRONMENT }}-api"
            "budgetbuddy-${{ env.ENVIRONMENT }}-api-features"
            "budgetbuddy-${{ env.ENVIRONMENT }}-api-features-extended"
            "budgetbuddy-${{ env.ENVIRONMENT }}-api-budgets"
            "budgetbuddy-${{ env.ENVIRONMENT }}-api-family"
            "budgetbuddy-${{ env.ENVIRONMENT }}-hosting"
            "budgetbuddy-${{ env.ENVIRONMENT }}-monitoring"
          )

          for stack in "${stacks[@]}"; do
            status=$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")

            # Accept both successful states and rollback complete (stack is functional)
            if [[ "$status" == "CREATE_COMPLETE" || "$status" == "UPDATE_COMPLETE" || "$status" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
              echo "✅ Stack $stack: $status"

              # Warn if in rollback state but don't fail
              if [[ "$status" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
                echo "⚠️  Warning: Stack is in ROLLBACK_COMPLETE state but functional"
                echo "   Next deployment will attempt to update from this state"
              fi
            else
              echo "❌ Stack $stack: $status"
              exit 1
            fi
          done

      - name: Test API endpoints
        if: needs.deploy-infrastructure.outputs.api-url != ''
        run: |
          API_URL="${{ needs.deploy-infrastructure.outputs.api-url }}"
          echo "Testing API endpoints at: $API_URL"

          # Test health endpoint
          if curl -f -s "$API_URL/health" > /dev/null; then
            echo "✅ Health endpoint responding"
          else
            echo "❌ Health endpoint failed"
            exit 1
          fi

          # Test auth health endpoint
          if curl -f -s "$API_URL/auth/health" > /dev/null; then
            echo "✅ Auth service responding"
          else
            echo "❌ Auth service failed"
            exit 1
          fi

          # Test budget health endpoint
          if curl -f -s "$API_URL/budget/health" > /dev/null; then
            echo "✅ Budget service responding"
          else
            echo "❌ Budget service failed"
            exit 1
          fi

      - name: Run deployment health check script
        run: |
          chmod +x scripts/check-deployment.sh
          bash scripts/check-deployment.sh ${{ env.ENVIRONMENT }}

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-web-app, health-checks]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deployment Summary
        run: |
          echo "## 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Development (${{ env.ENVIRONMENT }})" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # What was deployed — from commit message
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          echo "### 📦 What Was Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**$COMMIT_MSG**" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$COMMIT_BODY" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$COMMIT_BODY" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Classify the change type from commit prefix
          if [[ "$COMMIT_MSG" == fix:* ]]; then
            echo "🐛 **Type**: Bug Fix" >> $GITHUB_STEP_SUMMARY
          elif [[ "$COMMIT_MSG" == feat:* ]]; then
            echo "✨ **Type**: New Feature" >> $GITHUB_STEP_SUMMARY
          elif [[ "$COMMIT_MSG" == docs:* ]]; then
            echo "📚 **Type**: Documentation" >> $GITHUB_STEP_SUMMARY
          elif [[ "$COMMIT_MSG" == chore:* ]]; then
            echo "🔧 **Type**: Maintenance" >> $GITHUB_STEP_SUMMARY
          elif [[ "$COMMIT_MSG" == refactor:* ]]; then
            echo "♻️ **Type**: Refactor" >> $GITHUB_STEP_SUMMARY
          elif [[ "$COMMIT_MSG" == security:* || "$COMMIT_MSG" == *security* ]]; then
            echo "🔒 **Type**: Security Fix" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Files changed
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20)
          if [[ -n "$CHANGED" ]]; then
            echo "### 📁 Files Changed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$CHANGED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.deploy-infrastructure.result }}" == "success" && "${{ needs.health-checks.result }}" == "success" ]]; then
            echo "### ✅ Deployment Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**App URL**: https://d1ueeugn9zcx7n.cloudfront.net" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.deploy-infrastructure.outputs.api-url }}" != "" ]]; then
              echo "**API URL**: ${{ needs.deploy-infrastructure.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ❌ Deployment Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the job logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
