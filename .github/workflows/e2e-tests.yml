name: E2E Tests

on:
  # E2E tests are not yet complete — disabled automatic runs to reduce noise
  # Re-enable by adding workflow_run trigger once tests are stable
  # workflow_run:
  #   workflows: ["Deploy to Development"]
  #   types: [completed]
  #   branches: [develop]
  # Allow manual runs only
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (defaults to dev environment)"
        required: false
        default: ""
      browsers:
        description: "Browsers to test (chromium, firefox, webkit, all)"
        required: false
        default: "chromium"

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"

jobs:
  # Only run if the triggering workflow succeeded (or if manually triggered)
  check-trigger:
    name: Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping E2E tests: triggering workflow did not succeed"
          fi

  e2e-chromium:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url || secrets.DEV_BASE_URL }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-report
          path: test-results/html/
          retention-days: 7

  e2e-firefox:
    name: E2E Tests (Firefox)
    runs-on: ubuntu-latest
    needs: check-trigger
    if: |
      needs.check-trigger.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' && (inputs.browsers == 'firefox' || inputs.browsers == 'all'))
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Firefox only)
        run: npx playwright install firefox --with-deps

      - name: Run E2E tests (Firefox)
        run: npx playwright test --project=firefox
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url || secrets.DEV_BASE_URL }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-firefox-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-firefox-report
          path: test-results/html/
          retention-days: 7

  e2e-webkit:
    name: E2E Tests (WebKit)
    runs-on: ubuntu-latest
    needs: check-trigger
    if: |
      needs.check-trigger.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' && (inputs.browsers == 'webkit' || inputs.browsers == 'all'))
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (WebKit only)
        run: npx playwright install webkit --with-deps

      - name: Run E2E tests (WebKit)
        run: npx playwright test --project=webkit
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url || secrets.DEV_BASE_URL }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-report
          path: test-results/html/
          retention-days: 7

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-chromium, e2e-firefox, e2e-webkit]
    if: always() && needs.check-trigger.outputs.should_run == 'true'

    steps:
      - name: E2E Test Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium | ${{ needs.e2e-chromium.result == 'success' && '✅ Passed' || needs.e2e-chromium.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firefox  | ${{ needs.e2e-firefox.result == 'success' && '✅ Passed' || needs.e2e-firefox.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WebKit   | ${{ needs.e2e-webkit.result == 'success' && '✅ Passed' || needs.e2e-webkit.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Test artifacts are available in the Actions artifacts section (retained for 7 days)." >> $GITHUB_STEP_SUMMARY
