name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  NODE_VERSION: "20"

jobs:
  security-scan:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run comprehensive security scan
        run: |
          echo "🔒 Running comprehensive security validation..."

          # Make security script executable
          chmod +x scripts/security-check.sh

          # Run security checks
          bash scripts/security-check.sh

      - name: Run dependency audit
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=moderate

      - name: Run security property tests
        run: |
          echo "🧪 Running security property-based tests..."
          npx jest tests/security/ --config=tests/security/jest.config.js --testTimeout=120000

      - name: Check for exposed secrets
        run: |
          echo "🔍 Scanning for exposed secrets..."

          # Check for real JWT tokens (exclude mock files)
          if grep -r "eyJ[A-Za-z0-9+/=]\{100,\}" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=coverage \
              --exclude="*.md" \
              --exclude="mockAuth.ts" \
              --exclude="*.test.js" \
              --exclude="*.test.ts" 2>/dev/null; then
            echo "❌ Found potential real JWT tokens!"
            exit 1
          fi

          # Check for AWS credentials
          if grep -r "AKIA[0-9A-Z]\{16\}" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=coverage 2>/dev/null; then
            echo "❌ Found potential AWS access keys!"
            exit 1
          fi

          # Check for private keys
          if grep -r "BEGIN.*PRIVATE KEY" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=coverage 2>/dev/null; then
            echo "❌ Found potential private keys!"
            exit 1
          fi

          echo "✅ No exposed secrets detected"

      - name: Validate security configuration
        run: |
          echo "🔍 Validating security configuration..."

          # Check .gitignore has security entries
          if ! grep -q "auth-logs.txt" .gitignore; then
            echo "❌ Missing auth-logs.txt in .gitignore"
            exit 1
          fi

          if ! grep -q "debug-*.txt" .gitignore; then
            echo "❌ Missing debug-*.txt pattern in .gitignore"
            exit 1
          fi

          # Validate DevHelper has production exclusion
          if [ -f "packages/web-app/src/components/dev/DevHelper.tsx" ]; then
            if ! grep -q "import.meta.env.DEV" packages/web-app/src/components/dev/DevHelper.tsx; then
              echo "❌ DevHelper missing production exclusion logic"
              exit 1
            fi
          fi

          echo "✅ Security configuration validated"

      - name: Check mock authentication safety
        run: |
          echo "🔍 Validating mock authentication safety..."

          # Check mock tokens are properly marked
          if [ -f "packages/web-app/src/utils/mockAuth.ts" ]; then
            if grep "eyJ[A-Za-z0-9+/=]\{50,\}" packages/web-app/src/utils/mockAuth.ts | grep -v "MOCK\|TEST\|DEVELOPMENT" 2>/dev/null; then
              echo "❌ Mock tokens should contain obvious mock identifiers"
              exit 1
            fi
          fi

          # Check no mock auth in production code
          if grep -r "initMockAuth\|isMockAuthActive" packages/web-app/src \
              --exclude="mockAuth.ts" \
              --exclude="*.test.*" \
              --exclude="DevHelper.tsx" 2>/dev/null; then
            echo "❌ Mock auth usage found in production code"
            exit 1
          fi

          echo "✅ Mock authentication safety validated"

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check for syntax errors in Lambda functions
        run: |
          echo "🔍 Checking for optional chaining syntax errors..."
          if grep -r "? \." backend/functions/*/index.js; then
            echo "❌ Found invalid optional chaining syntax (? .) in Lambda functions!"
            echo "   Please use ?. instead of ? ."
            exit 1
          fi
          echo "✅ No optional chaining syntax errors found"

      - name: Validate Lambda function syntax
        run: |
          echo "🔍 Validating JavaScript syntax in Lambda functions..."
          for file in backend/functions/*/index.js; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              node -c "$file" || exit 1
            fi
          done
          echo "✅ All Lambda functions have valid syntax"

      - name: Check formatting (placeholder)
        run: echo "Formatting check placeholder - prettier not configured"

      - name: TypeScript compilation check
        run: npm run type-check

  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm install

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: CDK synthesis validation
        working-directory: infrastructure
        run: npx cdk synth --all --context environment=dev

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run comprehensive security scan
        run: |
          echo "🔒 Running comprehensive security validation..."
          npm run security:check

      - name: Check for exposed secrets
        run: |
          echo "🔍 Scanning for exposed secrets and sensitive information..."

          # Check for JWT tokens (real ones, not mock)
          if grep -r "eyJ[A-Za-z0-9+/=]\{100,\}" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="mockAuth.ts" --exclude="*.test.js"; then
            echo "❌ Found potential real JWT tokens in repository!"
            echo "   Please remove any real authentication tokens"
            exit 1
          fi

          # Check for hardcoded passwords (excluding validation patterns)
          if grep -r "password.*['\"][^'\"]*[A-Z][^'\"]*[0-9][^'\"]*[!@#$%^&*][^'\"]*['\"]" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="validation.ts" --exclude="*.test.js"; then
            echo "❌ Found potential hardcoded passwords!"
            echo "   Please use environment variables for passwords"
            exit 1
          fi

          # Check for AWS credentials
          if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ Found potential AWS access keys!"
            exit 1
          fi

          # Check for private keys
          if grep -r "BEGIN.*PRIVATE KEY" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ Found potential private keys!"
            exit 1
          fi

          # Check for log files that might contain sensitive data
          if find . -name "*.log" -o -name "auth-logs.txt" -o -name "debug-*.txt" | grep -v node_modules | grep -v .git; then
            echo "❌ Found log files that should not be committed!"
            echo "   Please remove log files and add them to .gitignore"
            exit 1
          fi

          echo "✅ No exposed secrets detected"

      - name: Validate environment variable usage
        run: |
          echo "🔍 Checking for proper environment variable usage..."

          # Check that test files use environment variables for passwords
          if grep -r "password.*:" scripts/ --include="*.js" | grep -v "process.env" | grep -v "CHANGE_ME_IN_ENV"; then
            echo "❌ Found hardcoded passwords in scripts!"
            echo "   Please use process.env.TEST_USER_PASSWORD"
            exit 1
          fi

          echo "✅ Environment variable usage looks good"

      - name: Check mock token safety
        run: |
          echo "🔍 Validating mock tokens are clearly marked..."

          # Check that mock tokens contain obvious mock identifiers
          if grep -r "eyJ[A-Za-z0-9+/=]\{50,\}" packages/web-app/src/utils/mockAuth.ts | grep -v "MOCK\|TEST\|DEVELOPMENT"; then
            echo "❌ Mock tokens should contain obvious mock identifiers!"
            exit 1
          fi

          echo "✅ Mock tokens are properly marked"

      - name: Validate .gitignore security entries
        run: |
          echo "🔍 Checking .gitignore for security entries..."

          required_entries=("auth-logs.txt" "*.log" "logs/" "debug-*.txt")

          for entry in "${required_entries[@]}"; do
            if ! grep -q "^$entry" .gitignore; then
              echo "❌ Missing required .gitignore entry: $entry"
              exit 1
            fi
          done

          echo "✅ .gitignore security entries are present"

  lambda-function-tests:
    name: Lambda Function Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install Lambda function dependencies
        run: |
          cd backend/functions/auth && npm install
          cd ../budget && npm install
          cd ../transactions && npm install
          cd ../ai && npm install
          cd ../family && npm install
          cd ../payment && npm install
          cd ../email && npm install
          cd ../admin && npm install

      - name: Run Lambda function tests
        run: npm run test:lambda

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, infrastructure-validation, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Validate build artifacts
        run: |
          echo "Validating build outputs..."
          echo "Build validation completed successfully"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs:
      [
        code-quality,
        infrastructure-validation,
        unit-tests,
        security-scan,
        lambda-function-tests,
        build-validation,
      ]
    if: always()

    steps:
      - name: PR Validation Summary
        run: |
          echo "## Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Tests | ${{ needs.lambda-function-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.code-quality.result }}" == "success" &&
                "${{ needs.infrastructure-validation.result }}" == "success" &&
                "${{ needs.unit-tests.result }}" == "success" &&
                "${{ needs.build-validation.result }}" == "success" ]]; then
            echo "🎉 **All validation checks passed!** This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some validation checks failed.** Please review and fix the issues before merging." >> $GITHUB_STEP_SUMMARY
          fi
